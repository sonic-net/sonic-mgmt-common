# Renovate updates go.mod and go.sum here itself, and go get raises other
# modules where the update needs it. This job fails a Renovate PR that changes
# the version of a module renovate.json holds for approval because of
# patches/apply.sh, when the PR is not the update of a held module. That update
# waits for dashboard approval, and its reviewer checks the patches; a change
# that arrives with another update would bypass both. The held modules require
# each other, so a held module's own update can move the others, and passes.
#
# A raised go directive is left to azure-pipelines.yml, which builds with the
# build container's Go and never downloads one.
#
# Those modules are read from renovate.json: the rule that adds the
# patched-module label.

name: Renovate go.mod

on:
  pull_request:
    branches:
      - 'master'
      - '202[0-9][0-9][0-9]'

permissions:
  contents: read

jobs:
  check:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          # The merge base with the base branch shows what the PR changed
          fetch-depth: 0

      - name: Check go.mod
        env:
          BASE: ${{ github.base_ref }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          git show "$(git merge-base HEAD "origin/${BASE}")":go.mod > "${RUNNER_TEMP}/base.mod"
          # Module versions in a go.mod, with replacements after requirements
          versions() {
            awk '
              /^require \($/ { r = 1; next }
              /^replace \($/ { p = 1; next }
              /^\)$/ { r = 0; p = 0; next }
              r { print $1, $2; next }
              p { print $1, $(NF); next }
              /^require / { print $2, $3; next }
              /^replace / { print $2, $(NF) }
            ' "$1"
          }
          held=$(jq -r '.packageRules[] | select((.addLabels // []) | index("patched-module")) | .matchPackageNames[]' renovate.json)
          # A held module's own PR names it in its title
          for module in ${held}; do
            case " ${TITLE} " in *" ${module} "*) exit 0 ;; esac
          done
          failed=0
          for module in ${held}; do
            before=$(versions "${RUNNER_TEMP}/base.mod" | awk -v m="${module}" '$1 == m { print $2 }' | paste -sd' ')
            after=$(versions go.mod | awk -v m="${module}" '$1 == m { print $2 }' | paste -sd' ')
            if [ "${before}" != "${after}" ]; then
              echo "This update also changes ${module} from ${before:-none} to ${after:-none}; renovate.json holds that module for its own approved update, because of patches/apply.sh" >&2
              failed=1
            fi
          done
          exit "${failed}"
